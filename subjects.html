            color: white;
            box-shadow:

                inset -3px -3px 7px #292b38;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .topic-card {
            background: #20212b;
            padding: 22px;
            border-radius: 22px;
            box-shadow:
                10px 10px 20px #0d0e13,
                -8px -8px 18px #2b2d38;
            transition: .2s;
        }

        .topic-card:hover {
            transform: translateY(-3px);
        }

        .topic-card h3 {
            color: #a78bfa;
            margin-bottom: 10px;
        }

        .topic-card p {
            color: #b8bac5;
            line-height: 1.5;
        }

        .topic-number {
            color: #77798a;
            font-size: 13px;
        }

        .topic-level {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 10px;
            background: #292b38;
            color: #c9cad3;
            font-size: 12px;
        }

        .study-btn {
            margin-top: 15px;
            width: 100%;
        }

        .completed {
            margin-top: 10px;
            color: #a78bfa;
            font-size: 13px;
            font-weight: 600;
        }

        .material-card {
            background: #20212b;
            padding: 30px;
            border-radius: 28px;
            box-shadow:
                12px 12px 25px #0d0e13,
                -10px -10px 22px #2b2d38;
        }

        .material-card h2 {
            color: #a78bfa;
            margin-bottom: 25px;
        }

        .material-card h3 {
            color: #c4b5fd;
            margin-top: 28px;
            margin-bottom: 12px;
        }

        .material-card p,
        .material-card li {
            color: #d0d1d9;
            line-height: 1.75;
        }

        .material-card ul,
        .material-card ol {
            padding-left: 25px;
        }

        .material-box {
            background: #1b1c25;
            padding: 18px;
            border-radius: 16px;
            margin: 15px 0;
            box-shadow:
                inset 4px 4px 8px #101117,
                inset -3px -3px 7px #292b38;
        }

        .code-box {
            background: #111218;
            padding: 18px;
            border-radius: 15px;
            overflow-x: auto;
            color: #ddd;
            margin: 15px 0;
        }

        .code-box pre {
            margin: 0;
            white-space: pre-wrap;
        }

        .interview-question {
            background: #1b1c25;
            padding: 15px 18px;
            border-radius: 14px;
            margin: 10px 0;
            color: #d8d8e0;
        }

        .quick-revision {
            border-left: 4px solid #8b5cf6;
            padding-left: 15px;
        }

        .complete-btn {
            margin-top: 25px;
            width: 100%;
        }

            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #aaa;

            .page {
                width: 94%;
            }

            .hero,
            .material-card {
                padding: 22px;
            }

/* =========================================================
   GENERIC MATERIAL FOR REMAINING TOPICS
   Topic-specific content is still generated around the
   actual topic instead of showing a blank page.
========================================================= */

function generateMaterial(subject, topic) {

    if (detailed[subject] && detailed[subject][topic]) {
        return detailed[subject][topic];
    }

    const subjectFocus = {

        DBMS:
        "database design, SQL, normalization, transactions, indexing and database interviews",

        OS:
        "processes, CPU scheduling, synchronization, deadlocks, memory management and file systems",

        CN:
        "network models, protocols, addressing, routing, TCP/IP and network security",

        OOP:
        "classes, objects, inheritance, polymorphism, abstraction, encapsulation and software design"

    };

    return {

        definition:
            `${topic} is an important ${subject} concept used in ${subjectFocus[subject]}.`,

        explanation:
            `For placement preparation, you should understand what ${topic} means, why it is used, how it works, its advantages and limitations, and where it is used in real-world systems.`,

        points: [
            `Understand the basic definition of ${topic}.`,
            `Know the working or main idea behind ${topic}.`,
            `Learn important terminology related to ${topic}.`,
            `Understand advantages and limitations.`,
            `Prepare common comparison-based questions.`,
            `Practice interview-oriented examples.`
        ],

        example:
            `${topic} should be understood with a simple real-world example and then connected with its technical implementation.`,

        interview: [
            `What is ${topic}?`,
            `Why is ${topic} used?`,
            `Explain ${topic} with an example.`,
            `What are the advantages and limitations of ${topic}?`,
            `How is ${topic} different from related concepts?`
        ],

        revision:
            `${topic} → definition → working → key points → example → interview questions.`
    };
}

   SEARCH
========================================================= */

function filterTopics() {

    const search =
        document
            .getElementById("topicSearch")
            .value
            .toLowerCase();

    const cards =
        document.querySelectorAll(".topic-card");

    let visible = 0;

    cards.forEach(card => {

        const name =
            card.dataset.topic;

        if (name.includes(search)) {

            card.style.display = "block";

            visible++;

        } else {

            card.style.display = "none";

        }

    });


    if (visible === 0) {

        if (!document.getElementById("noResults")) {

            const div =
                document.createElement("div");

            div.id = "noResults";

            div.className = "empty";

            div.innerHTML =
                "No topic found. Try another search.";

            document
                .getElementById("topicsGrid")
                .appendChild(div);

        }

    } else {

        const noResults =
            document.getElementById("noResults");

        if (noResults) {
            noResults.remove();
        }

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

if (subject && topic) {

    if (subjects[subject] &&
        subjects[subject].includes(topic)) {

        renderMaterial();

    } else {

        renderTopics();

    }

}
else if (subject) {

    renderTopics();

}
else {

    app.innerHTML = `

        <a class="top-back" href="core-blogs.html">
            ← Back to Core CS Blogs
        </a>

        <div class="hero">

            <h1>NEXORA 🤖</h1>

            <p>
                Select a Core CS subject to start your preparation.
            </p>

        </div>

    `;

}
