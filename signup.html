<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>NEXORA 🤖</h1>

    <h2>Create Your Account</h2>

    <form id="signupForm">

        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <br><br>

        <label>College</label>
        <input
            type="text"
            id="college"
            placeholder="Enter your college"
            required
        >

        <br><br>

        <label>Course / Branch</label>
        <input
            type="text"
            id="branch"
            placeholder="Enter your branch"
            required
        >

        <br><br>

        <label>Year</label>
        <select id="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <br><br>

        <label>Graduation Year</label>
        <input
            type="number"
            id="graduationYear"
            placeholder="e.g. 2027"
            required
        >

        <br><br>

        <label>Target Role</label>
        <select id="targetRole" required>
            <option value="">Select Target Role</option>
            <option value="Software Engineer">Software Engineer</option>
            <option value="Frontend Developer">Frontend Developer</option>
            <option value="Backend Developer">Backend Developer</option>
            <option value="Full Stack Developer">Full Stack Developer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="AI/ML Engineer">AI/ML Engineer</option>
        </select>

        <br><br>

        <h2>🎯 Initial Onboarding</h2>

        <label>What are you preparing for?</label>
        <select id="preparationType" required>
            <option value="">Select Preparation Type</option>
            <option value="Placement">Placement</option>
            <option value="Internship">Internship</option>
            <option value="Both">Both</option>
        </select>

        <br><br>

        <label>Current Level</label>
        <select id="currentLevel" required>
            <option value="">Select Level</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <br><br>

        <label>Daily Preparation Goal</label>
        <select id="dailyGoal" required>
            <option value="">Select Daily Goal</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="180">3+ hours</option>
        </select>

        <br><br>

        <button type="submit">
            Create Account 🚀
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>


    <script>

        const signupForm =
            document.getElementById("signupForm");


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const college =
                    document.getElementById("college").value;

                const branch =
                    document.getElementById("branch").value;

                const year =
                    document.getElementById("year").value;

                const graduationYear =
                    document.getElementById("graduationYear").value;

                const targetRole =
                    document.getElementById("targetRole").value;

                const preparationType =
                    document.getElementById("preparationType").value;

                const currentLevel =
                    document.getElementById("currentLevel").value;

                const dailyGoal =
                    Number(
                        document.getElementById("dailyGoal").value
                    );


                const message =
                    document.getElementById("message");


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({

                                    name,
                                    email,
                                    password,
                                    college,
                                    branch,
                                    year,
                                    graduationYear,
                                    targetRole,
                                    preparationType,
                                    currentLevel,
                                    dailyGoal

                                })

                            }
                        );


                    const data =
                        await response.json();


                    message.textContent =
                        data.message;


                    if (data.success) {

                        message.textContent =
                            "Account created successfully!";

                        setTimeout(
                            function () {

                                window.location.href =
                                    "dashboard.html";

                            },
                            1000
                        );

                    }

                }

                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );

    </script>

</body>

</html>
